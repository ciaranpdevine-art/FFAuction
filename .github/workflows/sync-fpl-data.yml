name: Sync FPL data

on:
  schedule:
    # Twice daily, shortly after the source dataset's own two daily
    # refreshes (07:30 and 17:30 UTC) — matches the cadence you were using
    # for manual imports.
    - cron: "40 7 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run sync
        working-directory: scripts
        run: node sync-fpl-data.mjs
