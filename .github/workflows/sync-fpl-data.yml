name: Sync FPL data

on:
  schedule:
    # Overnight, once the day's games are all finished (cron times are UTC):
    # 23:30 UTC = just after midnight UK time while clocks are on BST
    # (late March - late October), 23:30 UK time otherwise. The second run
    # is a safety net after the source's early-morning refresh in case the
    # first is delayed or skipped by GitHub.
    - cron: "30 23 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run sync
        working-directory: scripts
        run: node sync-fpl-data.mjs
