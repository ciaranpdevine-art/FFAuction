name: Sync FPL data

on:
  schedule:
    # Hourly check (UTC). The script only writes finished matches whose stats
    # are complete, and skips anything unchanged, so frequent runs are safe.
    # The source dataset itself refreshes ~3x/day, so results appear at the
    # first run after each source refresh. GitHub may start runs a bit late.
    - cron: "17 * * * *"
  workflow_dispatch: # lets you trigger a run manually from the Actions tab
    inputs:
      test_push:
        description: "Only send a test notification to every phone (no data sync)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run sync
        working-directory: scripts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: node sync-fpl-data.mjs
